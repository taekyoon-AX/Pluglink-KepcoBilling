<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한전표준시설부담금 납부시스템 · PLUGLINK</title>
<link rel="stylesheet" href="css/style.css" />

<!-- 외부 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>

<!-- ============== 로그인 ============== -->
<section id="view-login" class="view">
  <div class="login-panel">
    <div class="login-brand">
      <div class="brand-mark">
        <span class="brand-p">P</span>
        <svg class="brand-bolt" viewBox="0 0 12 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 0 L0 12 L5 12 L4 20 L12 8 L7 8 Z" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">PLUGLINK</div>
        <div class="brand-sub">한전표준시설부담금 납부시스템</div>
      </div>
    </div>
    <label class="field">
      <span>아이디</span>
      <input type="text" id="login-id" placeholder="시공사명 또는 admin" autocomplete="off" />
    </label>
    <button id="btn-login" class="btn btn-primary btn-lg">로그인</button>
    <p id="login-error" class="login-error"></p>
    <p class="login-note">비밀번호 없이 아이디만 입력하면 됩니다.</p>
  </div>
</section>

<!-- ============== 앱 셸 ============== -->
<div id="view-app" class="app-shell" style="display:none">
  <header class="app-header">
    <div class="app-header-left">
      <div class="brand-mark small">
        <span class="brand-p">P</span>
        <svg class="brand-bolt" viewBox="0 0 12 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 0 L0 12 L5 12 L4 20 L12 8 L7 8 Z" fill="currentColor"/>
        </svg>
      </div>
      <span class="header-title">한전표준시설부담금 <span class="header-title-muted">납부시스템</span></span>
    </div>
    <nav id="app-nav" class="app-nav"></nav>
    <div class="app-header-right">
      <span id="header-user" class="header-user"></span>
      <button id="btn-logout" class="btn btn-ghost btn-sm">로그아웃</button>
    </div>
  </header>

  <main id="app-content" class="app-content"></main>
</div>

<!-- ============== 파일 미리보기 모달 ============== -->
<div id="preview-overlay" class="modal-overlay">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="preview-title">파일 미리보기</h3>
      <button class="btn btn-ghost btn-sm" onclick="Preview.close()">✕</button>
    </div>
    <div id="preview-body" class="modal-body"></div>
  </div>
</div>

<!-- ============== 검토 뷰 (Drawer) ============== -->
<div id="review-overlay" class="drawer-overlay">
  <div class="drawer">
    <div class="drawer-header">
      <div>
        <h2 id="review-title">납부 요청 검토</h2>
        <p id="review-subtitle" class="muted"></p>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="Review.close()">✕</button>
    </div>
    <div id="review-body" class="drawer-body"></div>
    <div class="drawer-footer">
      <button class="btn btn-ghost" onclick="Review.close()">닫기</button>
      <button id="btn-review-delete" class="btn btn-danger">🗑 삭제</button>
      <button id="btn-review-flex" class="btn btn-outline">📝 지출결의서 (FLEX)</button>
      <button id="btn-review-confirm" class="btn btn-primary btn-lg">✓ 확인완료 · 폴더 저장</button>
    </div>
  </div>
</div>

<!-- ============== 로딩 스피너 ============== -->
<div id="loading-overlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <p id="loading-text">처리 중...</p>
</div>

<!-- ============== JS ============== -->
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/files.js"></script>
<script src="js/preview.js"></script>
<script src="js/review.js"></script>
<script src="js/contractor.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
